name: Build and publish simc image

# Recompiles SimulationCraft from upstream HEAD and publishes it to GHCR so the
# collector's short-lived sibling sims (simcBis.py) run current game data. The
# collector self-pulls SIMC_DOCKER_IMAGE on SIMC_PULL_INTERVAL, so a fresh image
# here propagates to production without touching the collector image.
#
# See Dockerfile.simc for the GPL-3.0 compliance notes (LICENSE + source commit).

on:
  # Daily is plenty: the collector self-pulls every 6h and upstream data changes
  # slowly. Runs at 04:00 UTC, clear of the pages build (08:00) and the
  # Wednesday full update.
  schedule:
    - cron: '0 4 * * *'
  push:
    paths:
      - 'Dockerfile.simc'
      - '.github/workflows/buildSimcImage.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (for Dockerfile.simc)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve simc HEAD revision
        id: rev
        run: echo "sha=$(git ls-remote https://github.com/simulationcraft/simc.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push simc image to GHCR
        uses: docker/build-push-action@v6
        with:
          # simc source is fetched inside the Dockerfile; the local context only
          # needs to supply Dockerfile.simc (from the checkout above).
          file: Dockerfile.simc
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            SIMC_REV=${{ steps.rev.outputs.sha }}
          tags: |
            ghcr.io/mythistone/simc:latest
            ghcr.io/mythistone/simc:${{ steps.rev.outputs.sha }}
          # Cache on the resolved commit: an unchanged upstream HEAD reuses the
          # compile layer and republishes the same digest cheaply.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=SimulationCraft (unofficial build)
            org.opencontainers.image.description=Unofficial SimulationCraft build for the MythiStone collector
            org.opencontainers.image.source=https://github.com/simulationcraft/simc
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
