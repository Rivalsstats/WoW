name: Build and publish simc image

# Recompiles SimulationCraft from upstream and publishes it to GHCR so the
# collector's short-lived sibling sims (simcBis.py) run current game data. The
# collector self-pulls SIMC_DOCKER_IMAGE on SIMC_PULL_INTERVAL, so a fresh image
# here propagates to production without touching the collector image.
#
# We do NOT trust the raw tip of simc's actively-developed `midnight` branch: it
# occasionally can't sim a spec (e.g. the Unholy DK army_ghoul break that failed
# buildPages runs 31325084815 and 31335443090). buildResilientSimcImage.sh samples
# recent commits newest->oldest and publishes the first image that can actually
# SIMULATE every spec, validated against simc's own profiles/CI.simc fetched at
# that commit. Staleness is therefore bounded by the newest *working* commit, not
# by this cron — a broken tip just ships an older good commit, and if everything
# we sample is broken we keep the last good :latest and fail loudly instead of
# shipping a broken build.
#
# See Dockerfile.simc for the GPL-3.0 compliance notes (LICENSE + source commit).

on:
  # Daily (not weekly): the walk-back handles a transient broken tip, but if an
  # entire candidate window is broken this cadence bounds recovery to ~a day
  # instead of a week. Cache-cheap when the chosen commit is unchanged. 04:00 UTC,
  # clear of the Wednesday full update.
  schedule:
    - cron: '0 4 * * WED'
  push:
    paths:
      - 'Dockerfile.simc'
      - '.github/workflows/buildSimcImage.yml'
      - 'backend_scripts/buildResilientSimcImage.sh'
      - 'backend_scripts/simcWalkback.sh'
      - 'backend_scripts/validateSimc.sh'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  # How many commits to ASK upstream for. simcWalkback.sh samples this window
  # geometrically (offsets 0,1,2,4,8,16,32), so a big cap costs nothing — it only
  # widens how far back a sustained break can be escaped from.
  SIMC_WALKBACK_CAP: '40'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (Dockerfile.simc, static data, scripts)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve candidate simc commits (newest first)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/simulationcraft/simc/commits?sha=midnight&per_page=${SIMC_WALKBACK_CAP}" \
            --jq '.[].sha' > candidates.txt
          echo "Candidate window ($(wc -l < candidates.txt) commits):"; cat candidates.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, validate, and push the newest working commit
        env:
          IMAGE: ghcr.io/mythistone/simc
        run: bash backend_scripts/buildResilientSimcImage.sh
