name: Build Jinja Pages

on:
  schedule:
    # TUE, THU, SAT, SUN
    - cron: '0 8 * * MON,FRI' #skip wednesday as we run full update on wednesday
  push:
    paths:
      - 'templates/**'
      - 'backend_scripts/generateSpecPages.py'
      - 'backend_scripts/generateCompPage.py'
      - 'backend_scripts/generateTierlistPage.py'
      - 'backend_scripts/generateSimcProfiles.py'
      - 'backend_scripts/generateDashboardPage.py'
      - 'backend_scripts/generateIndexPage.py'
      - 'backend_scripts/generateRoutesPage.py'
      - 'backend_scripts/generateItemPages.py'
      - 'backend_scripts/generateBlogPage.py'
      - 'backend_scripts/generateLegalPages.py'
      - 'backend_scripts/generateDungeonPages.py'
      - 'backend_scripts/generateSearchIndex.py'
      - 'backend_scripts/generateSitemap.py'
      - 'backend_scripts/generateLlmTxt.py'
      - 'backend_scripts/image_generation/**'
      - 'backend_scripts/commonUtils.py'
      - 'backend_scripts/chartData.py'
      - 'backend_scripts/tierMath.py'
      - 'assets/**'
      - 'data/static/**'
      - 'data/icons/**'
      - 'data/creature_img/**'
      - 'ads.txt'
      - 'robots.txt'

  workflow_dispatch:
    inputs:
      season_override:
        description: >-
          Build against this Blizzard season id instead of the current one.
          Used once per rollover to capture a FINAL snapshot of the outgoing
          season after seasonInfo.json has already flipped — see
          seasonRolloverWipe.yml, which gates the DB wipe on that snapshot.
          Requires data/static/seasonInfo.prev.json to describe this season.
        required: false
        default: ''
  workflow_run:
    workflows: ["Gather Static WoW data"]
    types:
      - completed
concurrency:
      group: "pages"
      # Do NOT cancel in-progress runs: a push must not kill an in-flight
      # multi-hour sim matrix. Queued runs still coalesce to the latest.
      cancel-in-progress: false
# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  # ----------------------------------------------------------------------
  # Which season is this build for? Normally seasonInfo.json. A season_override
  # dispatch builds the OUTGOING season instead, from seasonInfo.prev.json — the
  # one-off final snapshot that the rollover wipe is gated on. Resolved once here
  # so the generators, the sims and the archive branch name can never disagree.
  # ----------------------------------------------------------------------
  resolve-season:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      season_id: ${{ steps.resolve.outputs.season_id }}
      season_info: ${{ steps.resolve.outputs.season_info }}
      is_override: ${{ steps.resolve.outputs.is_override }}
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: main

      - name: Resolve target season
        id: resolve
        env:
          OVERRIDE: ${{ inputs.season_override }}
        run: |
          set -euo pipefail
          CURRENT=$(jq -r .blizzard_season_id data/static/seasonInfo.json)
          if [ -z "${OVERRIDE:-}" ] || [ "$OVERRIDE" = "$CURRENT" ]; then
            echo "season_id=$CURRENT"           >> "$GITHUB_OUTPUT"
            echo "season_info="                 >> "$GITHUB_OUTPUT"
            echo "is_override=false"            >> "$GITHUB_OUTPUT"
            echo "Building current season $CURRENT." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          PREV=data/static/seasonInfo.prev.json
          if [ ! -f "$PREV" ]; then
            echo "::error::season_override=$OVERRIDE requested but $PREV does not exist."
            exit 1
          fi
          PREV_ID=$(jq -r .blizzard_season_id "$PREV")
          if [ "$PREV_ID" != "$OVERRIDE" ]; then
            # Refuse rather than render the wrong season's branding over this
            # data — the archive step would freeze that as a permanent record.
            echo "::error::season_override=$OVERRIDE but $PREV describes season $PREV_ID."
            exit 1
          fi
          echo "season_id=$OVERRIDE"  >> "$GITHUB_OUTPUT"
          echo "season_info=$PREV"    >> "$GITHUB_OUTPUT"
          echo "is_override=true"     >> "$GITHUB_OUTPUT"
          { echo "Building **final snapshot of season $OVERRIDE** from \`$PREV\` (current is $CURRENT).";
            echo;
            echo "This run archives only — it does NOT deploy, so the live site keeps showing season $CURRENT.";
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------------
  # SimulationCraft tierlist sims (run on every trigger, in parallel with the
  # page build — they finish well before the pages do).
  # ----------------------------------------------------------------------
  prepare-sims:
    needs: [resolve-season]
    env:
      MYTHISTONE_SEASON_INFO: ${{ needs.resolve-season.outputs.season_info }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mysql-connector-python requests pyyaml

      - name: Generate SimulationCraft tierlist profiles
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: |
          python backend_scripts/generateSimcProfiles.py \
            --output_dir simc_profiles

      - name: Upload sim profiles
        uses: actions/upload-artifact@v4
        with:
          name: simc-profiles
          path: simc_profiles
          retention-days: 7

  # Build SimulationCraft from source so the sims use current game data — the
  # published Docker image lags weeks behind and skews DPS. Runs in parallel
  # with prepare-sims and buildPages; the binary is compiled ONCE here and
  # reused by every matrix leg. Cached on the resolved simc HEAD so repeat runs
  # skip the compile.
  build-simc:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve simc HEAD revision
        id: rev
        run: echo "sha=$(git ls-remote https://github.com/simulationcraft/simc.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache simc binary
        id: cache
        uses: actions/cache@v4
        with:
          path: simc-bin
          key: simc-bin-${{ steps.rev.outputs.sha }}

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev libcurl4-openssl-dev

      - name: Build SimulationCraft (CLI, no GUI)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --depth=1 https://github.com/simulationcraft/simc.git simc
          cmake -S simc -B simc/build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF
          cmake --build simc/build --parallel "$(nproc)" --target simc
          mkdir -p simc-bin
          cp "$(find simc/build -name simc -type f -executable | head -1)" simc-bin/simc
          simc-bin/simc --version || true

      - name: Upload simc binary
        uses: actions/upload-artifact@v4
        with:
          name: simc-binary
          path: simc-bin/simc
          retention-days: 1

  simulate:
    needs: [prepare-sims, build-simc]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        targets: [1, 3, 5, 8]
        gearset: [popular, simcbis]
    steps:
      - name: Download sim profiles
        uses: actions/download-artifact@v4
        with:
          name: simc-profiles
          path: simc_io

      - name: Download simc binary
        uses: actions/download-artifact@v4
        with:
          name: simc-binary
          path: simc-bin

      - name: Run SimulationCraft (${{ matrix.gearset }}, ${{ matrix.targets }} targets)
        run: |
          chmod +x simc-bin/simc
          # Single-target sims 3 min (180s); every multi-target sim 1 min (60s).
          # Overrides the profile's placeholder max_time, like desired_targets.
          if [ "${{ matrix.targets }}" -eq 1 ]; then
            max_time=180
          else
            max_time=60
          fi
          ./simc-bin/simc \
            simc_io/gearset_${{ matrix.gearset }}.simc \
            desired_targets=${{ matrix.targets }} \
            max_time="$max_time" \
            json2=simc_io/sim_${{ matrix.gearset }}_${{ matrix.targets }}t.json

      - name: Write sim metadata
        run: |
          printf '{"gearset":"%s","targets":%s,"simmed_at":"%s","run_id":"%s","sha":"%s"}' \
            "${{ matrix.gearset }}" "${{ matrix.targets }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${{ github.run_id }}" "${{ github.sha }}" \
            > simc_io/meta_${{ matrix.gearset }}_${{ matrix.targets }}t.json

      - name: Upload sim result
        uses: actions/upload-artifact@v4
        with:
          name: sim-result-${{ matrix.gearset }}-${{ matrix.targets }}t
          path: |
            simc_io/sim_${{ matrix.gearset }}_${{ matrix.targets }}t.json
            simc_io/meta_${{ matrix.gearset }}_${{ matrix.targets }}t.json
          retention-days: 7

  # ----------------------------------------------------------------------
  # Static pages (runs in parallel with the sims).
  # ----------------------------------------------------------------------
  buildPages:
    needs: [resolve-season, prepare-sims]
    env:
      MYTHISTONE_SEASON_INFO: ${{ needs.resolve-season.outputs.season_info }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: main

      - name: Checkout social images
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: social-images
          path: social-images

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jinja2 pyyaml requests mysql-connector-python bs4 openai Pillow matplotlib pandas

      - name: Clean up old dynamic assets
        run: |
            rm -rf assets/img/previews/*
            mkdir -p assets/img/previews

      # Freeze this reset week's Top Trends snapshot BEFORE any page is rendered,
      # so the index / spec / dungeon generators read a current week to diff.
      - name: Snapshot weekly trends
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          BLIZ_CLIENT_ID: ${{ secrets.BLIZ_CLIENT_ID }}
          BLIZ_CLIENT_SECRET: ${{ secrets.BLIZ_CLIENT_SECRET }}
        run: |
          python backend_scripts/snapshotTrends.py

      - name: Generate Dashboard HTML page
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          CLIENT_ID: ${{ secrets.BLIZ_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.BLIZ_CLIENT_SECRET }}
        run: |
          python backend_scripts/generateDashboardPage.py \
            --template templates/dashboard.html \
            --output_dir pages

      - name: Generate Index HTML page
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          BLIZ_CLIENT_ID: ${{ secrets.BLIZ_CLIENT_ID }}
          BLIZ_CLIENT_SECRET: ${{ secrets.BLIZ_CLIENT_SECRET }}
          RAIDERIO_API_KEY: ${{ secrets.RAIDERIO_API_KEY }}
        run: |
          python backend_scripts/generateIndexPage.py \
          --template templates/index.html \
          --output_dir .

      - name: Generate Routes HTML page
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: |
          python backend_scripts/generateRoutesPage.py \
            --template templates/find_routes.html  \
            --output_dir pages

      - name: Generate Comp Analysis HTML page
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          BLIZ_CLIENT_ID: ${{ secrets.BLIZ_CLIENT_ID }}
          BLIZ_CLIENT_SECRET: ${{ secrets.BLIZ_CLIENT_SECRET }}
        run: |
          python backend_scripts/generateCompPage.py \
            --output_dir pages \
            --template templates/comps.html

      - name: Generate Blog HTML page
        run: |
            python backend_scripts/generateBlogPage.py --images_dir social-images

      - name: Generate Analyzer HTML page
        run: |
          python backend_scripts/generateAnalyzerPage.py \
            --template templates/analyzer.html \
            --output_dir pages

      - name: Generate Legal HTML page
        run: |
          python backend_scripts/generateLegalPages.py \
            --output_dir pages

      - name: Generate Spec HTML pages
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: |
          python backend_scripts/generateSpecPages.py \
            --CLIENT_ID ${{secrets.BLIZ_CLIENT_ID}} \
            --CLIENT_SECRET ${{secrets.BLIZ_CLIENT_SECRET}} \
            --template templates/spec_page.html \
            --output_dir classes

      - name: Generate Dungeon HTML pages
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          KEYSTONE_GURU_USER: ${{ secrets.KEYSTONE_GURU_USER }}
          KEYSTONE_GURU_SECRET: ${{ secrets.KEYSTONE_GURU_SECRET }}
          KEYSTONE_GURU_PW: ${{ secrets.KEYSTONE_GURU_PW }}
        run: |
          rm -rf dungeons
          mkdir -p dungeons
          python backend_scripts/generateDungeonPages.py \
            --template templates/dungeon_page.html \
            --output_dir dungeons

      - name: Generate Item pages
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: |
          rm -rf items
          mkdir -p items
          python backend_scripts/generateItemPages.py \
            --template templates/items.html \
            --output_dir pages \
            --items_dir items

      - name: Generate Search index
        run: |
          python backend_scripts/generateSearchIndex.py

      - name: Generate Sitemap
        run: |
          python backend_scripts/generateSitemap.py

      - name: Generate llms.txt
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: |
          python backend_scripts/generateLlmTxt.py \
            --output_dir .

      - name: Upload generated site
        uses: actions/upload-artifact@v4
        with:
          name: generated-site
          path: |
            pages
            dungeons
            items
            classes
            index.html
            404.html
            sitemap.xml
            llms.txt
            assets/img/previews
            assets/json
          include-hidden-files: true
          retention-days: 1

  # ----------------------------------------------------------------------
  # Merge the built pages + sim results, render the tierlist, package _site.
  # ----------------------------------------------------------------------
  assemble:
    runs-on: ubuntu-latest
    # Default needs semantics: only runs if BOTH the pages and every sim leg
    # succeeded. If any sim fails, assemble + deploy are skipped and the whole
    # workflow is marked failed — no stale-data fallback, no partial deploy.
    needs: [resolve-season, buildPages, simulate]
    env:
      MYTHISTONE_SEASON_INFO: ${{ needs.resolve-season.outputs.season_info }}
      TARGET_SEASON_ID: ${{ needs.resolve-season.outputs.season_id }}
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: main

      - name: Checkout social images
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: social-images
          path: social-images

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jinja2 pillow

      - name: Download generated site
        uses: actions/download-artifact@v4
        with:
          name: generated-site
          path: .

      - name: Download sim results
        uses: actions/download-artifact@v4
        with:
          pattern: sim-result-*
          merge-multiple: true
          path: sim_results

      - name: Generate Sim DPS Tierlist page
        run: |
          python backend_scripts/generateTierlistPage.py \
            --sim_results_dir sim_results \
            --template templates/simc_tierlist.html \
            --output_dir pages

      - name: Assemble site for deployment
        run: |
          set -e
          mkdir -p _site/data
          cp -r pages dungeons items classes assets _site/
          cp -r data/icons data/creature_img _site/data/
          mkdir -p _site/data/social
          if compgen -G "social-images/*.png" > /dev/null; then
            cp social-images/*.png _site/data/social/
          fi
          cp index.html 404.html robots.txt sitemap.xml llms.txt _site/

      # Skipped for a season_override run: that build renders the OUTGOING season
      # and must only reach the archive, never the live site.
      - name: Upload static files as artifact
        if: ${{ needs.resolve-season.outputs.is_override != 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      # Cold-storage snapshot of the exact deployed site for later archive view.
      - name: Archive snapshot to season branch (separate repo)
        env:
          ARCHIVE_DEPLOY_KEY: ${{ secrets.ARCHIVE_DEPLOY_KEY }}
          ARCHIVE_REPO: git@github.com:MythiStone/Mythistone_Archive.git
        run: |
          set -euo pipefail
          # Same source the generators used, so the branch name can never drift
          # from the data inside it (a season_override build archives the
          # OUTGOING season, not the current one).
          SEASON_JSON="${MYTHISTONE_SEASON_INFO:-data/static/seasonInfo.json}"
          SEASON_ID=$(jq -r .blizzard_season_id "$SEASON_JSON")
          SLUG=$(jq -r .slug "$SEASON_JSON")
          # Latest region end date for this season, or null while it is running.
          # seasonRolloverWipe.yml uses this plus snapshot_utc to tell a FINAL
          # snapshot from a mid-season one before it lets the DB be wiped.
          SEASON_ENDS=$(jq -r '[(.ends // {})[] | select(. != null)] | max // ""' "$SEASON_JSON")
          NOW=$(date -u +%FT%TZ)
          if [ "$SEASON_ID" != "$TARGET_SEASON_ID" ]; then
            echo "::error::archive season $SEASON_ID != resolved target $TARGET_SEASON_ID"
            exit 1
          fi
          # Provenance marker inside the snapshot root
          jq -n \
            --argjson id "$SEASON_ID" \
            --arg slug "$SLUG" \
            --arg ends "$SEASON_ENDS" \
            --arg now "$NOW" \
            --arg sha "$GITHUB_SHA" \
            '{blizzard_season_id: $id, slug: $slug, season_ends_utc: (if $ends == "" then null else $ends end), snapshot_utc: $now, source_commit: $sha}' \
            > _site/SNAPSHOT.json
          # SSH auth via write-enabled deploy key on the archive repo
          mkdir -p ~/.ssh
          echo "$ARCHIVE_DEPLOY_KEY" > ~/.ssh/archive_key
          chmod 600 ~/.ssh/archive_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/archive_key -o StrictHostKeyChecking=accept-new"
          cd _site
          git init -q
          git checkout -q -b "season-${SEASON_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Snapshot ${SLUG} (season ${SEASON_ID}) @ ${NOW}"
          git push --force "$ARCHIVE_REPO" "season-${SEASON_ID}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [resolve-season, assemble]
    # A final-snapshot build renders the season that just ended. Publishing it
    # would roll the live site back a season, so those runs archive only.
    if: ${{ needs.resolve-season.outputs.is_override != 'true' }}
    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
