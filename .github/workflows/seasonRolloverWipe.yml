name: Season Rollover DB Wipe

# Requests a blanket DB wipe at a WoW season rollover — but only after the old
# season's site snapshot exists in the archive repo, and only after a human
# approves. This workflow does NOT delete anything itself: it raises an intent
# flag (wipe_control.request_season) that the paused collector + the MySQL event
# ev_season_wipe act on. See backend_scripts/database.sql and the plan for the
# full handshake.

on:
  # Fire on the season flip: getStaticData is what advances seasonInfo.json to the
  # new season, so its completion is exactly when detect() should re-evaluate
  # (current = new season, oldmax = the lingering old one). It is NOT gated on a
  # successful new-season buildPages, which fails during the pre-season gap and
  # used to block the wipe forever. The archive is verified independently in the
  # gate step below.
  workflow_run:
    workflows: ["Gather Static WoW data"]
    types: [completed]
  # Weekly self-guarding fallback in case the flip's completion event is missed;
  # detect() is a no-op when there is nothing to wipe.
  schedule:
    - cron: '0 10 * * WED'
  workflow_dispatch:

concurrency:
  group: "season-wipe"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Detect whether a rollover wipe should be requested. No environment here, so a
  # no-op run never triggers the approval prompt.
  detect:
    runs-on: ubuntu-latest
    # Run on any trigger/conclusion: detect() reads the (already-committed)
    # seasonInfo.json + the DB and is a no-op when there is nothing to wipe, so a
    # failed getStaticData simply yields no action rather than blocking the wipe.
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      current: ${{ steps.dbdetect.outputs.current }}
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mysql-connector-python

      - name: Detect pending season rollover
        id: dbdetect
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: python backend_scripts/requestSeasonWipe.py --detect

      # Branch existence is not enough. `season-<old>` is force-pushed on every
      # build while seasonInfo.json still names that season, so a mid-season
      # snapshot (taken before the season ended) would discard the season's final
      # days forever. So require a snapshot taken after the season ended.
      #
      # The FINAL snapshot is produced BEFORE the flip by seasonRolloverArchive.yml
      # (buildPages chain_static), while the outgoing season's static files are
      # still on disk. If it is missing here we can NOT recover by rebuilding: the
      # static reference files have already been overwritten by getStaticData, so a
      # post-flip build would render the old season against the new season's data.
      # We therefore block loudly for a human instead of dispatching a build that
      # would freeze a corrupted archive.
      - name: Confirm a FINAL archive snapshot of the old season exists
        id: gate
        if: ${{ steps.dbdetect.outputs.should_wipe == 'true' }}
        env:
          ARCHIVE_DEPLOY_KEY: ${{ secrets.ARCHIVE_DEPLOY_KEY }}
          ARCHIVE_REPO: git@github.com:MythiStone/Mythistone_Archive.git
          OLDMAX: ${{ steps.dbdetect.outputs.oldmax }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$ARCHIVE_DEPLOY_KEY" > ~/.ssh/archive_key
          chmod 600 ~/.ssh/archive_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/archive_key -o StrictHostKeyChecking=accept-new"

          block() {   # $1 = reason; refuse this cycle, loudly, with recovery guidance
            echo "::error::$1"
            { echo "### Season wipe blocked"; echo; echo "$1"; echo;
              echo "The final archive of season \`${OLDMAX}\` must be captured BEFORE getStaticData overwrites its static files. If getStaticData has already run, recovering it requires re-checking-out the pre-flip static data and re-running the archive manually — it can not be produced by a normal build now. Fix the archive, then re-run this workflow.";
            } >> "$GITHUB_STEP_SUMMARY"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          }

          if ! git ls-remote --heads --exit-code "$ARCHIVE_REPO" "season-${OLDMAX}" >/dev/null; then
            block "Archive branch season-${OLDMAX} does not exist — the outgoing season was never archived."
            exit 0
          fi

          # Blobless, checkout-free clone: fetches commit + trees only, then pulls
          # the single file on demand. Avoids downloading the ~350 MB snapshot.
          rm -rf archive_probe
          git clone --quiet --depth 1 --single-branch --branch "season-${OLDMAX}" \
                    --filter=blob:none --no-checkout "$ARCHIVE_REPO" archive_probe
          if ! git -C archive_probe show HEAD:SNAPSHOT.json > snapshot.json 2>/dev/null; then
            block "season-${OLDMAX} has no SNAPSHOT.json — cannot prove it is a final snapshot."
            exit 0
          fi
          cat snapshot.json

          SNAP_ID=$(jq -r '.blizzard_season_id // empty' snapshot.json)
          SNAP_AT=$(jq -r '.snapshot_utc // empty' snapshot.json)
          SNAP_ENDS=$(jq -r '.season_ends_utc // empty' snapshot.json)

          if [ "$SNAP_ID" != "$OLDMAX" ]; then
            block "season-${OLDMAX} contains a snapshot of season ${SNAP_ID:-unknown}."
            exit 0
          fi
          if [ -z "$SNAP_ENDS" ]; then
            block "season-${OLDMAX}'s snapshot records no season end date — it predates the final-snapshot check."
            exit 0
          fi
          # ISO-8601 UTC timestamps compare correctly as strings.
          if [ "$SNAP_AT" \< "$SNAP_ENDS" ]; then
            block "season-${OLDMAX} was archived at ${SNAP_AT}, before the season ended at ${SNAP_ENDS} — it is not the final state."
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          { echo "### Archive verified";
            echo;
            echo "\`season-${OLDMAX}\` snapshot taken ${SNAP_AT}, after the season ended ${SNAP_ENDS}. Clearing is safe.";
          } >> "$GITHUB_STEP_SUMMARY"

  # Raise the intent flag. The environment gate is the manual approval; it only
  # fires when detect said proceed=true, so approvals are requested only on a real
  # rollover.
  request-wipe:
    needs: detect
    if: ${{ needs.detect.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    environment: production-wipe
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mysql-connector-python

      - name: Raise wipe request
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        # Re-derive the season from seasonInfo.json rather than trusting the value
        # captured before the approval — that approval can sit pending for days,
        # and committing a stale, lower boundary would mark the wrong one cleared
        # and permanently block the real one. --expect-season makes any drift a
        # hard failure instead of a silent mistake.
        run: python backend_scripts/requestSeasonWipe.py --commit --expect-season "${{ needs.detect.outputs.current }}"
