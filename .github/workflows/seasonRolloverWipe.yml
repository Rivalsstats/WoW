name: Season Rollover DB Wipe

# Requests a blanket DB wipe at a WoW season rollover. This workflow does NOT
# delete anything itself: it raises an intent flag (wipe_control.request_season)
# that the paused collector + the MySQL event ev_season_wipe act on. See
# backend_scripts/database.sql for the handshake.
#
on:
  # Fire on the season flip (getStaticData advances seasonInfo.json). Detect-and-
  # notify only — never commits.
  workflow_run:
    workflows: ["Gather Static WoW data"]
    types: [completed]
  # Weekly self-guarding fallback in case the flip's completion event is missed.
  schedule:
    - cron: '0 10 * * WED'
  # The ONLY path that can raise the wipe request. Requires typing the season id.
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          Type the season id you are rolling INTO (the "current" season detect
          reports, e.g. 18) to authorize the DESTRUCTIVE blanket wipe of all
          older-season data. Any other value aborts and wipes nothing.
        required: true
        type: string

concurrency:
  group: "season-wipe"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Detect whether a rollover wipe is pending and that the old season is archived.
  # Read-only; runs on every trigger and is a no-op when there is nothing to wipe.
  detect:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      current: ${{ steps.dbdetect.outputs.current }}
      oldmax: ${{ steps.dbdetect.outputs.oldmax }}
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mysql-connector-python

      - name: Detect pending season rollover
        id: dbdetect
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: python backend_scripts/requestSeasonWipe.py --detect

      # The only pre-wipe safety: the outgoing season was archived at all. Every
      # buildPages run force-pushes `season-<id>` to the archive repo, so a normal
      # build within the last week already froze this season's site. If the branch
      # is missing, the season was never archived, so block loudly.
      - name: Confirm the old season was archived
        id: gate
        if: ${{ steps.dbdetect.outputs.should_wipe == 'true' }}
        env:
          ARCHIVE_DEPLOY_KEY: ${{ secrets.ARCHIVE_DEPLOY_KEY }}
          ARCHIVE_REPO: git@github.com:MythiStone/Mythistone_Archive.git
          OLDMAX: ${{ steps.dbdetect.outputs.oldmax }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$ARCHIVE_DEPLOY_KEY" > ~/.ssh/archive_key
          chmod 600 ~/.ssh/archive_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/archive_key -o StrictHostKeyChecking=accept-new"

          if git ls-remote --heads --exit-code "$ARCHIVE_REPO" "season-${OLDMAX}" >/dev/null; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            { echo "### Archive present";
              echo;
              echo "\`season-${OLDMAX}\` exists in the archive repo. Clearing is safe.";
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Archive branch season-${OLDMAX} does not exist — the outgoing season was never archived; refusing to wipe."
            { echo "### Season wipe blocked"; echo;
              echo "Archive branch \`season-${OLDMAX}\` does not exist — the outgoing season was never archived. Run a normal buildPages while seasonInfo.json still names season ${OLDMAX}, then re-run this workflow.";
            } >> "$GITHUB_STEP_SUMMARY"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  # Automated triggers stop here: alert a human that a wipe is pending and MUST be
  # authorized by hand. Never commits.
  notify:
    needs: detect
    if: ${{ github.event_name != 'workflow_dispatch' && needs.detect.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Alert that a wipe is pending manual authorization
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          CURRENT: ${{ needs.detect.outputs.current }}
          OLDMAX: ${{ needs.detect.outputs.oldmax }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/seasonRolloverWipe.yml
        run: |
          set -euo pipefail
          MSG="🚨 Season rollover ready: season ${OLDMAX} data is archived and pending a BLANKET DB wipe (rolling into season ${CURRENT}). Nothing has been wiped. To proceed, manually run the 'Season Rollover DB Wipe' workflow with confirm=${CURRENT}: ${RUN_URL}"
          { echo "### Wipe pending manual authorization"; echo; echo "$MSG"; } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${DISCORD_WEBHOOK:-}" ]; then
            jq -n --arg c "$MSG" '{content: $c}' \
              | curl -sS -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK" \
              || echo "::warning::Discord notification failed; the job summary still carries the notice."
          else
            echo "::warning::DISCORD_WEBHOOK not set; only the job summary carries the wipe-pending notice."
          fi

  # Manual dispatch only: validate the typed confirmation before anything with DB
  # access runs. A mismatch fails the run loudly and wipes nothing.
  authorize:
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      - name: Validate manual confirmation
        id: check
        env:
          CONFIRM: ${{ inputs.confirm }}
          CURRENT: ${{ needs.detect.outputs.current }}
          PROCEED: ${{ needs.detect.outputs.proceed }}
        run: |
          set -euo pipefail
          if [ "${PROCEED}" != "true" ]; then
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            echo "::error::No wipe is pending — detect did not clear the rollover/archive gate. Nothing to authorize."
            exit 1
          fi
          if [ "${CONFIRM}" != "${CURRENT}" ]; then
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            echo "::error::Confirmation mismatch: you typed '${CONFIRM}', expected the current season '${CURRENT}'. Aborting — nothing was wiped."
            exit 1
          fi
          echo "authorized=true" >> "$GITHUB_OUTPUT"
          { echo "### Wipe authorized";
            echo;
            echo "Confirmation \`${CONFIRM}\` matches the current season. Proceeding to raise the wipe request.";
          } >> "$GITHUB_STEP_SUMMARY"

  # Raise the intent flag. Reached ONLY after a human dispatched the workflow and
  # the typed confirmation matched.
  request-wipe:
    needs: [detect, authorize]
    if: ${{ needs.authorize.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mysql-connector-python

      - name: Raise wipe request
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        # Re-derive the season from seasonInfo.json rather than trusting the value
        # captured at detect time — a manual dispatch may happen days later, and
        # committing a stale, lower boundary would mark the wrong one cleared and
        # permanently block the real one. --expect-season makes any drift a hard
        # failure instead of a silent mistake.
        run: python backend_scripts/requestSeasonWipe.py --commit --expect-season "${{ needs.detect.outputs.current }}"
