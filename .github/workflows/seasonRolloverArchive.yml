name: Season Rollover Archive

# The Wednesday entry point that decides whether this is a rollover week and, if
# so, archives the OUTGOING season BEFORE the static refresh overwrites its data.
#
# Why this exists: "Gather Static WoW data" (getStaticData) flips
# seasonInfo.json AND overwrites the static reference files (equippable-items,
# dungeon/spell metadata). Once it runs, the outgoing season can no longer be
# rendered faithfully, so its final archive must be captured first. getStaticData
# therefore has no schedule of its own — this workflow dispatches it:
#   * normal week   -> dispatch getStaticData directly (no rollover to archive).
#   * rollover week -> dispatch a normal buildPages run with chain_static=true;
#                      that build archives the outgoing season, then hands off to
#                      getStaticData itself (buildPages' final step). Doing it via
#                      the build's own completion avoids a multi-hour waiting job
#                      here (GH's 6h job cap would otherwise be a risk while the
#                      sim matrix runs).
# After getStaticData flips the season, seasonRolloverWipe.yml (triggered on its
# completion) requests the DB wipe behind the manual production-wipe approval.

on:
  # Before getStaticData's old 08:00 slot, with margin. getStaticData no longer
  # has its own cron; this is the sole Wednesday entry point.
  schedule:
    - cron: '0 2 * * WED'
  workflow_dispatch:

concurrency:
  group: "season-rollover-archive"
  cancel-in-progress: false

permissions:
  contents: read
  # to dispatch buildPages.yml / getStaticData.yml
  actions: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # Same flip test as fetchSeasonAndPeriodInfo: Blizzard current-season id vs
      # our stored seasonInfo.json. Needs Blizzard creds only — no DB access.
      - name: Detect season rollover
        id: detect
        env:
          BLIZ_CLIENT_ID: ${{ secrets.BLIZ_CLIENT_ID }}
          BLIZ_CLIENT_SECRET: ${{ secrets.BLIZ_CLIENT_SECRET }}
        run: python backend_scripts/detectSeasonRollover.py

      # Rollover week: archive the OUTGOING season first. This is a NORMAL build
      # (no season_override — seasonInfo.json still names the outgoing season, and
      # its static files are still on disk), so it deploys the final old-season
      # site AND pushes the final archive branch. chain_static makes that build
      # dispatch getStaticData once the archive is safely pushed.
      - name: Archive outgoing season, then chain static refresh
        if: ${{ steps.detect.outputs.is_rollover == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Rollover detected — dispatching buildPages (chain_static=true) to archive season ${{ steps.detect.outputs.season_id }}." \
            >> "$GITHUB_STEP_SUMMARY"
          gh workflow run buildPages.yml -f chain_static=true

      # Normal week: no rollover, so just run the weekly static refresh directly.
      - name: Run static refresh (normal week)
        if: ${{ steps.detect.outputs.is_rollover != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "No rollover — dispatching Gather Static WoW data directly." \
            >> "$GITHUB_STEP_SUMMARY"
          gh workflow run getStaticData.yml
